spring.application.name=dsa-viz-backend

# ==============================================================================
# Server
# ==============================================================================
# PORT is honoured because every PaaS injects it. 8080 locally.
server.port=${PORT:8080}

# Trusts X-Forwarded-* / X-Forwarded-Proto from the platform's proxy. Without this,
# request.getRemoteAddr() is the proxy and scheme detection thinks it is plain HTTP.
server.forward-headers-strategy=framework

# Never leak internals: our GlobalExceptionHandler already returns friendly messages.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==============================================================================
# Database
# ==============================================================================
# Set EITHER the three spring.datasource.* variables OR a single URL. Supported URL
# variable names, in order: DATABASE_URL, JDBC_DATABASE_URL, POSTGRES_URL.
#   postgres://user:password@host:5432/dbname
# Every PaaS Postgres add-on (Render, Railway, Heroku, Fly) injects one of these.
spring.datasource.url=jdbc:postgresql://localhost:5432/Algostreamz
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Schema is managed by Hibernate. Move to Flyway before the first real migration.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==============================================================================
# Transactional email (SMTP)
# ==============================================================================
# Set MAIL_* for your SMTP provider. Gmail is the local default; Brevo and SES can be
# selected by overriding MAIL_HOST and credentials in the launch environment.
#   MAIL_HOST=smtp-relay.brevo.com
#   MAIL_HOST=email-smtp.us-east-1.amazonaws.com   (SES)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Short timeouts: on a PaaS, a hung relay must not pin a request thread.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from-name=DSA Viz
# MUST be a sender/address you have verified with your mail provider, otherwise
# Brevo silently drops the message. This is the single most common setup failure.
app.mail.from-email=
app.mail.app-name=DSA Viz
# Used to build the link inside the email; set to your deployed frontend origin.
app.mail.app-url=http://localhost:5173

# ==============================================================================
# One-time passwords
# ==============================================================================
app.otp.ttl-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-per-hour-per-email=5
app.otp.max-per-hour-per-ip=20
app.otp.cleanup-interval-ms=900000
# Defaults to the JWT secret so there is nothing extra to set. Set OTP_PEPPER to
# rotate it independently; changing it invalidates every outstanding code.
app.otp.pepper=JWT_SECRET

# ==============================================================================
# JWT
# ==============================================================================
# REQUIRED in production - startup fails with a clear message if absent or <32 bytes.
# Generate with:  openssl rand -base64 48
jwt.secret=
jwt.expiration-ms=86400000
jwt.issuer=dsa-viz-backend

# ==============================================================================
# CORS
# ==============================================================================
# Set to your deployed frontend origin(s), comma separated.
app.cors.allowed-origins=http://localhost:5173

# ==============================================================================
# Optional: Cloudinary (avatar uploads)
# ==============================================================================
# Leave blank to boot without it - the bean only registers when this is non-empty.
cloudinary.url=${CLOUDINARY_URL:}

# ==============================================================================
# Actuator
# ==============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
