spring.application.name=dsa-viz-backend

# ==============================================================================
# Server
# ==============================================================================
# PORT is honoured because every PaaS injects it. 8080 locally.
server.port=${PORT:8080}

# Trusts X-Forwarded-* / X-Forwarded-Proto from the platform's proxy. Without this,
# request.getRemoteAddr() is the proxy and scheme detection thinks it is plain HTTP.
server.forward-headers-strategy=framework

# Never leak internals: our GlobalExceptionHandler already returns friendly messages.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==============================================================================
# Database
# ==============================================================================
# Set EITHER the three spring.datasource.* variables OR a single URL. Supported URL
# variable names, in order: DATABASE_URL, JDBC_DATABASE_URL, POSTGRES_URL.
#   postgres://user:password@host:5432/dbname
# Every PaaS Postgres add-on (Render, Railway, Heroku, Fly) injects one of these.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}

# Schema is managed by Hibernate. Move to Flyway before the first real migration.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==============================================================================
# Transactional email (SMTP)
# ==============================================================================
# Set MAIL_* for your SMTP provider. Gmail is the local default; Brevo and SES can be
# selected by overriding MAIL_HOST and credentials in the launch environment.
#   MAIL_HOST=smtp-relay.brevo.com
#   MAIL_HOST=email-smtp.us-east-1.amazonaws.com   (SES)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# Short timeouts: on a PaaS, a hung relay must not pin a request thread.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}

app.mail.from-name=${MAIL_FROM_NAME:DSA Viz}
# MUST be a sender/address you have verified with your mail provider, otherwise
# Brevo silently drops the message. This is the single most common setup failure.
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.app-name=${APP_NAME:DSA Viz}
# Used to build the link inside the email; set to your deployed frontend origin.
app.mail.app-url=${APP_URL:http://localhost:5173}

# ==============================================================================
# One-time passwords
# ==============================================================================
app.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-per-hour-per-email=${OTP_MAX_PER_HOUR_PER_EMAIL:5}
app.otp.max-per-hour-per-ip=${OTP_MAX_PER_HOUR_PER_IP:20}
app.otp.cleanup-interval-ms=${OTP_CLEANUP_INTERVAL_MS:900000}
# Defaults to the JWT secret so there is nothing extra to set. Set OTP_PEPPER to
# rotate it independently; changing it invalidates every outstanding code.
app.otp.pepper=${OTP_PEPPER:${JWT_SECRET:}}

# ==============================================================================
# JWT
# ==============================================================================
# REQUIRED in production - startup fails with a clear message if absent or <32 bytes.
# Generate with:  openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:dsa-viz-backend}

# ==============================================================================
# CORS
# ==============================================================================
# Set to your deployed frontend origin(s), comma separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==============================================================================
# Optional: Cloudinary (avatar uploads)
# ==============================================================================
# Leave blank to boot without it - the bean only registers when this is non-empty.
cloudinary.url=${CLOUDINARY_URL:}

# ==============================================================================
# Actuator
# ==============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
