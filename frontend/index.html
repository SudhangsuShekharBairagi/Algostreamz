<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F8FAFC" />
    <script>
      (() => {
        let preference = 'system'
        try {
          const stored = localStorage.getItem('algostreamz.theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored
        } catch {
          // Use the system preference when storage is unavailable.
        }
        const theme = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference
        document.documentElement.setAttribute('data-theme', theme)
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0B0F19' : '#F8FAFC')
      })()
    </script>
    <title>Algostreamz — Watch algorithms think, one step at a time.</title>
    <meta name="description" content="Algostreamz turns sorting, searching, trees and graphs into step-by-step visual stories with plain-English explanations and Zen mode for deep focus." />
    <link rel="canonical" href="https://algostreamz.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://algostreamz.com/" />
    <meta property="og:title" content="Algostreamz — Watch algorithms think, one step at a time." />
    <meta property="og:description" content="Interactive data structures and algorithms visualization platform with step-by-step snapshots and Zen mode." />
    <meta property="og:image" content="https://algostreamz.com/og-image.png" />
    <meta property="og:site_name" content="Algostreamz" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://algostreamz.com/" />
    <meta name="twitter:title" content="Algostreamz — Watch algorithms think, one step at a time." />
    <meta name="twitter:description" content="Interactive data structures and algorithms visualization platform with step-by-step snapshots and Zen mode." />
    <meta name="twitter:image" content="https://algostreamz.com/og-image.png" />

    <!-- JSON-LD WebSite Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Algostreamz",
      "url": "https://algostreamz.com",
      "description": "Watch algorithms think, one step at a time. Interactive DSA visualization workbench."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
